name: Build Windows desktop download
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check app and desktop integration
        run: |
          node scripts/check-busbar-display.cjs
          node scripts/check-symbol-labels.cjs
          node scripts/check-desktop.cjs
          node scripts/check-studio-upgrade.cjs
      - name: Fetch verified Electron runtime
        run: python desktop/fetch-runtime.py build/runtime
      - name: Package complete Windows app
        run: python desktop/package-windows.py build/runtime build/Riser-Studio-Windows.zip
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" build/Riser-Studio-Windows.zip --target "$GITHUB_SHA" --title "Riser Studio desktop ${GITHUB_RUN_NUMBER}" --notes-file RELEASE-NOTES.md --latest
